[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# Allow deploy script to write ./deployments-<chainid>.json
fs_permissions = [{ access = "read-write", path = "./" }]

# Mezo testnet (verified): chain id 31611
[rpc_endpoints]
mezo_testnet = "https://rpc.test.mezo.org"
